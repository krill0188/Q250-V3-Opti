[metadata]
name = llm_mission_planner
version = 0.1.0

[options]
packages = find:
data_files =
    share/ament_index/resource_index/packages = resource/llm_mission_planner
    share/llm_mission_planner = package.xml
    share/llm_mission_planner/launch = launch/mission_planner.launch.py
    share/llm_mission_planner/config = config/mission_planner.yaml

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    mission_planner_node = llm_mission_planner.mission_planner_node:main
    mission_validator_node = llm_mission_planner.mission_validator_node:main