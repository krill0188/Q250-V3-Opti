# Costmap 2D Parameters for Q250-V3-Opti
# Based on docs/12-obstacle-avoidance-pipeline.md

local_costmap:
  ros__parameters:
    # Global frame setup
    global_frame: odom
    robot_base_frame: base_link
    robot_radius: 0.35

    # Update rate
    update_frequency: 10.0
    publish_frequency: 5.0
    transform_tolerance: 0.5

    # Map size (meters)
    width: 10.0
    height: 10.0
    resolution: 0.05
    origin_x: -5.0
    origin_y: -5.0

    # Rolling window (follows robot)
    rolling_window: true
    track_unknown_space: true

    # Plugins
    plugins:
      - {name: obstacles, type: "nav2_costmap_2d::ObstacleLayer"}
      - {name: inflation, type: "nav2_costmap_2d::InflationLayer"}

    # Obstacle layer (from depth camera pointcloud)
    obstacles:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: depth_camera
      depth_camera:
        topic: /camera/depth/points
        sensor_frame: camera_link
        data_type: "PointCloud2"
        marking: true
        clearing: true
        min_obstacle_height: -0.5
        max_obstacle_height: 2.0
        obstacle_range: 5.0
        raytrace_range: 6.0
        observation_persistence: 0.0
        expected_update_rate: 0.0

    # Inflation layer
    inflation:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.8
      cost_scaling_factor: 3.0
      inflation_cost_max: 253

# Global costmap (for reference, not used in local avoidance)
global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    robot_radius: 0.35
    update_frequency: 1.0
    publish_frequency: 0.5
    transform_tolerance: 1.0
    width: 50.0
    height: 50.0
    resolution: 0.1
    rolling_window: false
    track_unknown_space: true
    plugins:
      - {name: static, type: "nav2_costmap_2d::StaticLayer"}
      - {name: obstacles, type: "nav2_costmap_2d::ObstacleLayer"}
      - {name: inflation, type: "nav2_costmap_2d::InflationLayer"}