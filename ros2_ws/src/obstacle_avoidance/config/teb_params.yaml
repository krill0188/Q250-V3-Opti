# TEB Local Planner Parameters for Q250-V3-Opti
# Based on docs/12-obstacle-avoidance-pipeline.md

TebLocalPlannerROS:
  # Robot frame setup
  odom_topic: /mavros/local_position/odom
  map_frame: odom
  robot_frame: base_link

  # Robot constraints (adjust for your vehicle)
  max_vel_x: 2.0
  max_vel_x_backwards: 0.5
  max_vel_y: 1.0
  max_vel_theta: 1.5
  acc_lim_x: 1.0
  acc_lim_y: 1.0
  acc_lim_theta: 1.0

  # Goal tolerance
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1
  free_goal_vel: false

  # Obstacle avoidance
  min_obstacle_dist: 0.5
  inflation_dist: 0.8
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.5
  obstacle_poses_affected: 30

  # Optimization
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false

  # Weights (tune for your vehicle)
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1
  weight_kinematics_forward_drive: 1
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 1
  weight_obstacle: 50
  weight_inflation: 10

  # Trajectory
  dt_ref: 0.3
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 3.0
  feasibility_check_no_poses: 4

  # Robot footprint (quadrotor: circular approximation)
  footprint_model:
    type: "circular"
    radius: 0.35  # Half diagonal of frame + margin

  # Homotopy class planning (optional)
  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 4
  selection_cost_hysteresis: 1.0
  selection_prefer_initial_plan: 0.9
  selection_obst_cost_scale: 100.0
  selection_alternative_time_cost: false

  # Recovery
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 10.0
  oscillator_recovery: true