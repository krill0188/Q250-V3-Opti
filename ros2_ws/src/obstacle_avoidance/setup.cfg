[metadata]
name = obstacle_avoidance
version = 0.1.0

[options]
packages = find:
data_files =
    share/ament_index/resource_index/packages = resource/obstacle_avoidance
    share/obstacle_avoidance = package.xml
    share/obstacle_avoidance/launch = launch/obstacle_avoidance.launch.py
    share/obstacle_avoidance/config = config/teb_params.yaml
    share/obstacle_avoidance/config = config/costmap_params.yaml

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    obstacle_distance_pub = obstacle_avoidance.obstacle_distance_pub:main
    safety_watchdog = obstacle_avoidance.safety_watchdog:main