[metadata]
name = swarm_comm
version = 0.1.0

[options]
packages = find:
data_files =
    share/ament_index/resource_index/packages = resource/swarm_comm
    share/swarm_comm = package.xml
    share/swarm_comm/launch = launch/swarm_comm.launch.py
    share/swarm_comm/config = config/swarm_comm.yaml

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    position_broadcaster = swarm_comm.position_broadcaster:main
    collision_avoidance = swarm_comm.collision_avoidance:main
    swarm_coordinator = swarm_comm.swarm_coordinator:main