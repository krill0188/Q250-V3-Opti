[metadata]
name = fake_gps
version = 0.1.0

[options]
packages = find:
data_files =
    share/ament_index/resource_index/packages = resource/fake_gps
    share/fake_gps = package.xml
    share/fake_gps/launch = launch/fake_gps.launch.py
    share/fake_gps/config = config/fake_gps.yaml

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    fake_gps_node = fake_gps.fake_gps_node:main