# /etc/netplan/01-netcfg.yaml
# Jetson 고정 IP 설정 (공유 라우터 환경)
network:
  version: 2
  renderer: networkd
  wifis:
    wlan0:
      dhcp4: false
      addresses: [192.168.1.100/24]
      gateway4: 192.168.1.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]
      access-points:
        "MyRouter":
          password: "router_password"
