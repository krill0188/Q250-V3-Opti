[General]
TcpServerPort=5760
ReportStats=true

[UartEndpoint fc]
Device=/dev/ttyTHS1
Baud=921600

[UdpEndpoint gcs]             # GDT → PC (실버스 매쉬 경유)
Mode=Normal
Address=192.168.10.1          # PC IP
Port=14550

[UdpEndpoint swarm]           # 기체간 P2P (실버스 매쉬 = 브로드캐스트 가능)
Mode=Normal
Address=192.168.10.255
Port=14560

[TcpEndpoint silvus_mavlink]  # Air Unit 이더넷 MAVLink 직접 수신 (옵션)
Mode=Normal
Address=192.168.10.11         # 자기 IP (기체별 수정 필요)
Port=14551
