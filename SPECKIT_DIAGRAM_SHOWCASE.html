<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpecKit Interactive Diagram Showcase</title>
  <script src="https://unpkg.com/@excalidraw/excalidraw@latest/dist/excalidraw.production.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@excalidraw/excalidraw@latest/dist/excalidraw.production.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
      --fg: #e6edf3; --fg-muted: #8b949e; --accent: #58a6ff;
      --accent-hover: #79b8ff; --border: #30363d; --success: #3fb950;
      --warning: #d29922; --danger: #f85149; --card-bg: #161b22;
    }
    [data-theme="light"] {
      --bg: #ffffff; --bg-secondary: #f6f8fa; --bg-tertiary: #f3f4f6;
      --fg: #1f2328; --fg-muted: #656d76; --accent: #0969da;
      --accent-hover: #0969da; --border: #d0d7de; --card-bg: #ffffff;
      --success: #2da44e; --warning: #9a6700; --danger: #cf222e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg); color: var(--fg); min-height: 100vh;
      line-height: 1.6;
    }
    .app { max-width: 1400px; margin: 0 auto; padding: 24px; }
    header { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--fg-muted); font-size: 1.1rem; }
    .controls { display: flex; gap: 12px; margin: 24px 0; flex-wrap: wrap; align-items: center; }
    .btn { padding: 10px 20px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--fg); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
    .btn:hover { background: var(--bg-tertiary); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: var(--accent-hover); }
    .diagram-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 24px; }
    .diagram-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); }
    .card-title { font-weight: 600; font-size: 1.05rem; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--fg-muted); }
    .excalidraw-container { width: 100%; height: 420px; background: var(--bg); }
    .excalidraw-wrapper { width: 100%; height: 100%; }
    .legend { padding: 16px 20px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: var(--fg-muted); border-top: 1px solid var(--border); }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-color { width: 12px; height: 12px; border-radius: 3px; }
    footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; color: var(--fg-muted); }
    .theme-toggle { position: fixed; top: 24px; right: 24px; z-index: 100; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card-bg); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 1000; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 768px) { .diagram-grid { grid-template-columns: 1fr; } .controls { flex-direction: column; align-items: stretch; } }
  </style>
</head>

        elements: [

          {type:"rectangle",x:510,y:30,width:200,height:320,strokeColor:"#d29922",backgroundColor:"rgba(210,153,34,0.08)",strokeWidth:2,roughness:1,label:"UAV-3 (심층 탐색)\nSNR: 8.5 dB ▼\nPER: 12.3% ▲\nETX: 4.2 ▲\nRSSI: -85 dBm\nChannel: 5785 MHz\nHop: 2",fontSize:12},
          {type:"rectangle",x:750,y:30,width:200,height:320,strokeColor:"#f85149",backgroundColor:"rgba(248,81,73,0.08)",strokeWidth:2,roughness:1,label:"UAV-4 (최종 타격)\nSNR: 4.1 dB ▼▼\nPER: 24.7% ▲▼\nETX: 8.7 ▲▼\nRSSI: -92 dBm\nChannel: 5805 MHz\nHop: 3",fontSize:12},
          {type:"rectangle",x:30,y:370,width:920,height:120,strokeColor:"#58a6ff",backgroundColor:"rgba(88,166,255,0.05)",strokeWidth:2,strokeStyle:"dashed",roughness:1,label:"실시간 재최적화 트리거: UAV-4 PER 24.7% > 10% 임계값 → IQP 재최적화 실행 → 채널 5745MHz로 변경 → PER 2.1% 개선 ✓",fontSize:13},
          {type:"rectangle",x:30,y:510,width:450,height:100,strokeColor:"#3fb950",backgroundColor:"rgba(63,185,80,0.08)",strokeWidth:2,roughness:1,label:"✓ UAV-1: SNR 22.3dB / PER 0.02% / ETX 1.15  (정상)\n✓ UAV-2: SNR 15.2dB / PER 1.2% / ETX 2.8   (주의)\n⚠ UAV-3: SNR 8.5dB / PER 12.3% / ETX 4.2   (경고)\n⚠ UAV-4: SNR 4.1dB / PER 24.7% / ETX 8.7   (위험)",fontSize:12},
          {type:"rectangle",x:500,y:510,width:450,height:100,strokeColor:"#58a6ff",backgroundColor:"rgba(88,166,255,0.05)",strokeWidth:2,strokeStyle:"dashed",roughness:1,label:"자동 재최적화 파이프라인\n1. 트리거 감지 (PER>0.1, SNR<10, ETX>3)\n2. IQP 최적화 실행 (CPLEX, <5초)\n3. 주파수 재할당 → Silvus 채널 변경\n4. 품질 검증 → 롤백/확정\n5. MAVLink SILVUS_REOPT_STATUS 발행",fontSize:12},
        ],
        legend: [
          {color:"#58a6ff",label:"정상 (SNR>20, PER<1%)"},
          {color:"#a371f7",label:"주의 (SNR 10-20, PER 1-5%)"},
          {color:"#d29922",label:"경고 (SNR 5-10, PER 5-15%)"},
          {color:"#f85149",label:"위험 (SNR<5, PER>15%)"},

    ];

    // ========== RENDERING ==========
    const grid = document.getElementById('diagramGrid');

    diagrams.forEach((diagram, idx) => {
      const card = document.createElement('div');
      card.className = 'diagram-card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">${diagram.title}</span>
          <div class="card-tags">
            ${diagram.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
        <div class="excalidraw-container">
          <div class="excalidraw-wrapper" id="excalidraw-${diagram.id}"></div>
        </div>
        <div class="legend">
          ${diagram.legend.map(l => `<span class="legend-item"><span class="legend-color" style="background:${l.color}"></span>${l.label}</span>`).join('')}
        </div>
      `;
      grid.appendChild(card);
    });

    // Initialize Excalidraw instances
    const excalidrawInstances = {};

    diagrams.forEach((diagram, idx) => {
      const container = document.getElementById(`excalidraw-${diagram.id}`);
      if (!container) return;

      // Create a minimal Excalidraw-like rendering using canvas
      const canvas = document.createElement('canvas');
      canvas.width = container.clientWidth || 480;
      canvas.height = 420;
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.borderRadius = '0 0 12px 12px';
      container.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      drawDiagram(ctx, diagram);
    });

    function drawDiagram(ctx, diagram) {
      const { elements } = diagram;
      const width = ctx.canvas.width;
      const height = ctx.canvas.height;

      // Clear
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0d1117';
      ctx.fillRect(0, 0, width, height);

      // Draw elements
      elements.forEach(el => {
        ctx.save();
        ctx.strokeStyle = el.strokeColor || '#8b949e';
        ctx.fillStyle = el.backgroundColor || 'transparent';
        ctx.lineWidth = el.strokeWidth || 1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (el.strokeStyle === 'dashed') ctx.setLineDash([8, 4]);
        else if (el.strokeStyle === 'dotted') ctx.setLineDash([3, 3]);
        else ctx.setLineDash([]);

        switch (el.type) {
          case 'rectangle':
            if (el.backgroundColor && el.backgroundColor !== 'transparent') {
              ctx.fillRect(el.x, el.y, el.width, el.height);
            }
            if (el.strokeWidth > 0) ctx.strokeRect(el.x, el.y, el.width, el.height);
            if (el.label) drawTextInRect(ctx, el.label, el.x, el.y, el.width, el.height, el.fontSize || 12);
            break;
          case 'ellipse':
            drawEllipse(ctx, el.x + el.width/2, el.y + el.height/2, el.width/2, el.height/2);
            if (el.label) drawTextInRect(ctx, el.label, el.x, el.y, el.width, el.height, el.fontSize || 12);
            break;
          case 'diamond':
            drawDiamond(ctx, el.x + el.width/2, el.y + el.height/2, el.width/2, el.height/2);
            if (el.label) drawTextInRect(ctx, el.label, el.x, el.y, el.width, el.height, el.fontSize || 12);
            break;
          case 'line':
            ctx.beginPath();
            ctx.moveTo(el.x, el.y);
            ctx.lineTo(el.endX, el.endY);
            ctx.stroke();
            break;
          case 'arrow':
            drawArrow(ctx, el.x, el.y, el.x + el.width, el.y + el.height);
            break;
        }
        if (el.label && (el.type === 'line' || el.type === 'arrow')) {
          drawTextOnLine(ctx, el.label, el.x, el.y, el.endX, el.endY, el.fontSize || 10);
        }
        ctx.restore();
      });

      // Draw legend
      const legendY = 380;
      diagram.legend.forEach((l, i) => {
        ctx.fillStyle = l.color;
        ctx.fillRect(20, 380 + i * 22, 14, 14);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#e6edf3';
        ctx.font = '12px sans-serif';
        ctx.fillText(l.label, 40, 392 + i * 22);
      });
    }

    function drawEllipse(ctx, cx, cy, rx, ry) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      if (ctx.fillStyle !== 'transparent' && ctx.fillStyle !== 'rgba(0, 0, 0, 0)') ctx.fill();
      ctx.stroke();
    }

    function drawDiamond(ctx, cx, cy, rx, ry) {
      ctx.beginPath();
      ctx.moveTo(cx, cy - ry);
      ctx.lineTo(cx + rx, cy);
      ctx.lineTo(cx, cy + ry);
      ctx.lineTo(cx - rx, cy);
      ctx.closePath();
      if (ctx.fillStyle !== 'transparent' && ctx.fillStyle !== 'rgba(0, 0, 0, 0)') ctx.fill();
      ctx.stroke();
    }

    function drawArrow(ctx, fromX, fromY, toX, toY) {
      const headLen = 10;
      const angle = Math.atan2(toY - fromY, toX - fromX);
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI/6), toY - headLen * Math.sin(angle - Math.PI/6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI/6), toY - headLen * Math.sin(angle + Math.PI/6));
      ctx.closePath();
      ctx.fill();
    }

    function drawTextInRect(ctx, text, x, y, w, h, fontSize) {
      ctx.font = `${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif`;
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#e6edf3';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lines = text.split('\n');
      const lineHeight = fontSize * 1.3;
      const startY = y + h/2 - (lines.length - 1) * lineHeight / 2;
      lines.forEach((line, i) => {
        ctx.fillText(line, x + w/2, startY + i * lineHeight);
      });
    }

    function drawTextOnLine(ctx, text, x1, y1, x2, y2, fontSize) {
      if (!text) return;
      ctx.font = `${fontSize}px sans-serif`;
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg-muted').trim() || '#8b949e';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      ctx.fillText(text, mx, my - 4);
    }
  }

  // Theme toggle
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isDark ? '🌙 다크모드' : '☀️ 라이트모드';
    // Redraw all diagrams
    diagrams.forEach((diagram, idx) => {
      const canvas = document.querySelector(`#excalidraw-${diagram.id} canvas`);
      if (canvas) {
        const ctx = canvas.getContext('2d');
        drawDiagram(ctx, diagrams[idx]);
      }
    });
  }

  function expandAll() {
    showToast('모든 다이어그램 확대 완료');
  }
  function collapseAll() {
    showToast('모든 다이어그램 축소 완료');
  }
  function exportAll() {
    showToast('전체 내보내기 기능 준비 중...');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }

  // Initialize theme
  document.documentElement.setAttribute('data-theme', 'dark');
